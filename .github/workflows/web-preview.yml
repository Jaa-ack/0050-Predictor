name: Build synthetic web preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: ubuntu-latest
    env:
      LOKY_MAX_CPU_COUNT: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e .
      - run: python -m twquant demo
      - run: python -m twquant --root artifacts/demo export-web --out artifacts/web-preview
      - run: python -m twquant secrets audit
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-web-preview
          path: artifacts/web-preview
          retention-days: 7

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2e">
  <meta name="description" content="0050 Predict 開盤方向研究、驗證結果與逐筆因子">
  <title>開盤方向 | 0050 Predict</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./assets/opening.css">
  <script type="module" src="./assets/opening.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳至主要內容</a>
  <aside class="rail" aria-label="工作台導覽">
    <a class="brand" href="#overview">
      <span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i></span>
      <span><strong>0050 Predict</strong><small>台股研究工作台</small></span>
    </a>
    <nav class="nav">
      <a class="nav-link active" href="#overview"><i class="nav-icon overview-icon" aria-hidden="true"></i>總覽</a>
      <a class="nav-link" href="#predictions"><i class="nav-icon list-icon" aria-hidden="true"></i>逐筆預測</a>
      <a class="nav-link" href="#research"><i class="nav-icon archive-icon" aria-hidden="true"></i>日線研究</a>
      <a class="nav-link" href="#architecture"><i class="nav-icon flow-icon" aria-hidden="true"></i>系統架構</a>
    </nav>
    <div class="rail-bottom">
      <span id="rail-status">正在連接</span>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="header-actions"><span class="time-zone">臺北時間 UTC+8</span><span class="mode-pill" id="mode">連線中</span></div>
    </header>
    <main id="main">
      <section id="overview" class="overview" aria-labelledby="title">
        <div class="heading">
          <div>
            <h1 id="title">開盤方向</h1>
            <p>每日 <strong>08:59</strong> 預測正式開盤是否高於前收</p>
          </div>
          <div class="heading-actions">
            <div class="segment" aria-label="開盤模型">
              <button type="button" data-view="week" aria-pressed="true" aria-controls="architecture predictions">原試撮模型</button>
              <button type="button" data-view="repair" aria-pressed="false" aria-controls="architecture predictions">試撮＋修正</button>
            </div>
            <button class="secondary" type="button" id="refresh">重新整理</button>
          </div>
        </div>
        <p id="alert" class="alert" role="status" hidden></p>
        <div id="metrics" class="metrics" aria-label="核心指標" aria-live="polite"></div>
        <section class="panel comparison" aria-labelledby="comparison-title">
          <header class="panel-heading"><div><h2 id="comparison-title">同日模型比較</h2><p id="comparison-date"></p></div></header>
          <div id="comparison" class="table-frame" role="region" aria-label="配對驗證分數" tabindex="0"></div>
          <div id="paired-window" class="paired-window"></div>
        </section>
        <section class="panel comparison" id="source-study" aria-labelledby="source-study-title" hidden>
          <header class="panel-heading"><div><h2 id="source-study-title">多來源歷史驗證</h2><p id="source-study-range"></p></div></header>
          <div class="table-frame" id="source-study-scores" role="region" aria-label="歷史留出分數" tabindex="0"></div>
        </section>
        <section class="panel network" id="architecture" aria-labelledby="architecture-title">
          <header class="panel-heading">
            <div><h2 id="architecture-title">系統運作圖</h2><p>選取節點或連線查看資料與權重</p></div>
            <span id="flow-key" class="flow-key">資料線寬 · 影響比重</span>
          </header>
          <div class="flow-layout">
            <div class="flow-board" id="flow-board"><canvas id="flow-canvas" aria-hidden="true"></canvas><div id="flow-layer"></div></div>
            <div class="flow-inspector" id="flow-inspector" aria-live="polite"></div>
          </div>
        </section>
        <div class="dashboard">
          <section class="panel trend" aria-labelledby="trend-title">
            <header class="panel-heading">
              <div><h2 id="trend-title">逐日試撮覆蓋</h2><p id="trend-subtitle"></p></div>
              <span id="trend-legend" class="chart-legend"></span>
            </header>
            <div id="trend"></div>
          </section>
        </div>
      </section>
      <section class="panel predictions" id="predictions" aria-labelledby="predictions-title">
        <header class="panel-heading prediction-heading">
          <div><h2 id="predictions-title">逐筆開盤預測</h2><p id="prediction-context"></p></div>
          <div class="table-controls">
            <label><span class="visually-hidden">交易日</span><select id="decision-day" aria-label="交易日"></select></label>
            <label><span class="visually-hidden">代號或公司</span><input id="query" type="search" placeholder="搜尋代號或公司" autocomplete="off"></label>
            <label><span class="visually-hidden">篩選結果</span><select id="result-filter" aria-label="篩選結果"><option value="all">成分股結果</option><option value="hit">命中</option><option value="miss">未命中</option><option value="pending">缺答案</option></select></label>
          </div>
        </header>
        <div class="prediction-key"><span><b>比較基準</b> 上一交易日收盤</span><span><b>未高於</b> 平盤或開低</span><span><b>缺答案</b> 計入評分分母</span></div>
        <div class="table-frame">
          <table>
            <thead><tr><th scope="col">標的</th><th scope="col">預測</th><th scope="col" id="signal-column">高於前收分數</th><th scope="col" class="actual-col">正式開盤</th><th scope="col" class="result-col">判定</th><th scope="col"><span class="visually-hidden">影響因素</span></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="table-empty" class="empty" hidden></div>
        <div class="table-bottom"><span id="row-count" aria-live="polite"></span><div class="pagination"><button id="previous" type="button">上一頁</button><span id="page-number"></span><button id="next" type="button">下一頁</button></div></div>
      </section>
      <section class="panel daily-panel" id="research" aria-labelledby="research-title">
        <header class="panel-heading prediction-heading">
          <div><h2 id="research-title">日線研究</h2><p>未來收盤相對基準日收盤</p></div>
          <div class="table-controls">
            <label><span class="visually-hidden">日線工作區</span><select id="daily-workspace" aria-label="日線工作區"></select></label>
            <label><span class="visually-hidden">日線區間</span><select id="daily-horizon" aria-label="日線區間">
              <option value="1">1 交易日</option><option value="5">5 交易日</option><option value="20">20 交易日</option></select></label>
          </div>
        </header>
        <div class="segment daily-switch" aria-label="日線頁籤">
          <button type="button" data-daily-view="forecasts" aria-pressed="true">日線預測</button>
          <button type="button" data-daily-view="backtests" aria-pressed="false">回測與基準</button>
          <button type="button" data-daily-view="sources" aria-pressed="false">資料與操作</button>
        </div>
        <div id="daily-content" aria-live="polite"><p class="empty">等待日線研究資料</p></div>
      </section>
      <footer class="footer"><span>0050 Predict</span><span>固定十檔訓練 · 完整成分股驗證</span></footer>
    </main>
  </div>
</body>
</html>
